version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: psychometric-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - psychometric-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./psychometric-patent/psychometric-system-backup/backend
      dockerfile: Dockerfile
    container_name: psychometric-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - JWT_SECRET=${JWT_SECRET}
      - CLIENT_URL=${CLIENT_URL:-http://localhost:3000,http://localhost:80}

    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - psychometric-network

  frontend:
    build:
      context: ./psychometric-patent/psychometric-system-backup/frontend
      dockerfile: Dockerfile
    container_name: psychometric-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - psychometric-network

networks:
  psychometric-network:
    driver: bridge

volumes:
  mongo-data:
    driver: local
